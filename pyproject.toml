[build-system]
requires = [
  "setuptools>=68",
  "wheel",
  "Cython>=0.29",
  "numpy>=1.22",
]
build-backend = "setuptools.build_meta"

[project]
name = "vision-engine"
version = "0.1.0"
description = "AprilTag detector bindings implemented in Cython"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.22",
]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: C",
  "Programming Language :: Python :: Implementation :: CPython",
  "Operating System :: OS Independent",
]

[tool.setuptools]
include-package-data = true
